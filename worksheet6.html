    { id: 't0605', time: '6:05', correct: 'five past six', options: ['five past six', 'five to six', 'quarter past six', 'six fifty-five'], grammar: 'Minutes past', hint: 'Five minutes after six.', appendix: { phrase: '… past …', slovak: '… po …' } },
    { id: 't1205', time: '12:05', correct: 'five past twelve', options: ['five past twelve', 'five to twelve', 'quarter past twelve', 'twelve fifty-five'], grammar: 'Minutes past', hint: 'Just after twelve.', appendix: null },
    { id: 't0210', time: '2:10', correct: 'ten past two', options: ['ten past two', 'ten to two', "two ten o'clock", 'quarter to two'], grammar: 'Minutes past', hint: 'Ten minutes after two.', appendix: null },
    { id: 't0710', time: '7:10', correct: 'ten past seven', options: ['ten past seven', 'ten to seven', 'quarter past seven', 'seven fifty'], grammar: 'Minutes past', hint: 'Ten past seven.', appendix: null },
    { id: 't0520', time: '5:20', correct: 'twenty past five', options: ['twenty past five', 'twenty to five', 'half past five', "five twenty o'clock"], grammar: 'Minutes past', hint: 'Twenty after five.', appendix: null },
    { id: 't0620', time: '6:20', correct: 'twenty past six', options: ['twenty past six', 'twenty to six', 'quarter past six', 'six forty'], grammar: 'Minutes past', hint: 'Twenty minutes past six.', appendix: null },
    { id: 't0925', time: '9:25', correct: 'twenty-five past nine', options: ['twenty-five past nine', 'twenty-five to nine', 'quarter past nine', "nine twenty-five o'clock"], grammar: 'Minutes past', hint: 'Before half past — use past nine.', appendix: null },
    { id: 't1125', time: '11:25', correct: 'twenty-five past eleven', options: ['twenty-five past eleven', 'twenty-five to eleven', 'half past eleven', 'eleven thirty-five'], grammar: 'Minutes past', hint: 'Twenty-five past eleven.', appendix: null },
    { id: 't0735', time: '7:35', correct: 'twenty-five to eight', options: ['twenty-five to eight', 'twenty-five past seven', 'half past seven', 'seven thirty-five past'], grammar: 'Minutes to', hint: 'After half past — count to eight.', appendix: { phrase: '… to …', slovak: '… do / na …' } },
    { id: 't0135', time: '1:35', correct: 'twenty-five to two', options: ['twenty-five to two', 'twenty-five past one', 'half past one', 'one thirty-five'], grammar: 'Minutes to', hint: 'Twenty-five minutes before two.', appendix: null },
    { id: 't0440', time: '4:40', correct: 'twenty to five', options: ['twenty to five', 'twenty past four', 'forty past four', 'quarter past four'], grammar: 'Minutes to', hint: 'Twenty before five.', appendix: null },
    { id: 't0940', time: '9:40', correct: 'twenty to ten', options: ['twenty to ten', 'twenty past nine', 'nine forty past', 'quarter to ten'], grammar: 'Minutes to', hint: 'Twenty minutes to ten.', appendix: null },
    { id: 't1150', time: '11:50', correct: 'ten to twelve', options: ['ten to twelve', 'ten past eleven', 'fifty past eleven', 'quarter to twelve'], grammar: 'Minutes to', hint: 'Ten minutes before twelve.', appendix: null },
    { id: 't0750', time: '7:50', correct: 'ten to eight', options: ['ten to eight', 'ten past seven', 'seven fifty past', 'quarter to eight'], grammar: 'Minutes to', hint: 'Ten to eight.', appendix: null },
    { id: 't0355', time: '3:55', correct: 'five to four', options: ['five to four', 'five past three', 'quarter to four', 'three fifty-five past'], grammar: 'Minutes to', hint: 'Almost four o\'clock.', appendix: null },
    { id: 't0155', time: '1:55', correct: 'five to two', options: ['five to two', 'five past one', 'quarter to two', 'one fifty-five'], grammar: 'Minutes to', hint: 'Five minutes before two.', appendix: null },
    { id: 't0855', time: '8:55', correct: 'five to nine', options: ['five to nine', 'five past eight', 'quarter to nine', 'eight forty-five'], grammar: 'Minutes to', hint: 'Nearly nine.', appendix: null },
    { id: 't0505', time: '5:05', correct: 'five past five', options: ['five past five', 'five to five', 'quarter past five', 'five fifty-five'], grammar: 'Minutes past', hint: 'Five past five.', appendix: null },
    { id: 't1015', time: '10:15', correct: 'quarter past ten', options: ['quarter past ten', 'quarter to ten', 'half past ten', 'ten forty-five'], grammar: 'Quarter past', hint: 'Quarter after ten.', appendix: null }
];

var poolById = {};
QUESTION_POOL.forEach(function (q) { poolById[q.id] = q; });

var state = {
    mode: 'select',
    setIds: [],
    activeSet: [],
    liveCheckEnabled: false
};

var fillDebounceTimers = {};

function getSetSize() {
    return profile.setSize;
}

function storageKey() {
    return STORAGE_KEY + '_' + profile.level;
}

function activeQuestionPool() {
    if (profile.level === 'advanced') return QUESTION_POOL;
    return QUESTION_POOL.filter(function (q) { return EASY_GRAMMAR[q.grammar]; });
}

function profileLabel() {
    if (profile.level === 'easy') return 'Easy · choose only';
    if (profile.level === 'supported') return 'Supported · short & simpler';
    return 'Advanced · full practice';
}

var LEVEL_NAV = [
    { level: 'easy', href: 'worksheet6.html?level=easy', label: 'Easy' },
    { level: 'supported', href: 'worksheet6.html?level=supported', label: 'Supported' },
    { level: 'advanced', href: 'worksheet6.html?level=advanced', label: 'Advanced' }
];

function levelIconSvg(level) {
    if (level === 'easy') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>';
    }
    if (level === 'supported') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="12" r="6"/><path d="M14 8l6 4-6 4V8z"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 18V6M12 18V4M18 18v-8"/></svg>';
}

function buildLevelSwitch() {
    var nav = document.getElementById('levelSwitch');
    if (!nav) return;
    nav.innerHTML = LEVEL_NAV.map(function (item) {
        var active = profile.level === item.level ? ' active' : '';
        return '<a href="' + item.href + '" class="' + active.trim() + '" title="' + item.label + '">'
            + levelIconSvg(item.level) + item.label + '</a>';
    }).join('');
}

function applyProfileFromUrl() {
    document.documentElement.classList.remove('ui-supported');
    var level = (new URLSearchParams(location.search).get('level') || 'advanced').toLowerCase();
    if (level === 'expert') level = 'advanced';
    if (level === 'easy') {
        profile.level = 'easy';
        profile.lockMode = true;
        profile.setSize = 10;
        state.mode = 'select';
    } else if (level === 'supported') {
        profile.level = 'supported';
        profile.lockMode = false;
        profile.setSize = 5;
        state.mode = 'select';
        document.documentElement.classList.add('ui-supported');
    } else {
        profile.level = 'advanced';
        profile.lockMode = false;
        profile.setSize = 10;
    }
}

function loadState() {
    try {
        var raw = JSON.parse(localStorage.getItem(storageKey()) || 'null');
        if (!raw || !Array.isArray(raw.setIds) || raw.setIds.length !== getSetSize()) return false;
        if (!raw.setIds.every(function (id) { return poolById[id]; })) return false;
        state.mode = raw.mode === 'fill' ? 'fill' : 'select';
        state.setIds = raw.setIds.slice();
        state.activeSet = state.setIds.map(function (id, i) {
            var q = poolById[id];
            return { num: i + 1, poolId: id, time: q.time, correct: q.correct, options: q.options, grammar: q.grammar, hint: q.hint, appendix: q.appendix };
        });
        return true;
    } catch (e) {
        return false;
    }
}

function saveState() {
    var answersSelect = {};
    var answersFill = {};
    document.querySelectorAll('[data-answer-kind="select"]').forEach(function (el) {
        if (el.value) answersSelect[el.id] = el.value;
    });
    document.querySelectorAll('[data-answer-kind="fill"]').forEach(function (el) {
        if (el.value) answersFill[el.id] = el.value;
    });
    localStorage.setItem(storageKey(), JSON.stringify({
        mode: state.mode,
        setIds: state.setIds,
        answersSelect: answersSelect,
        answersFill: answersFill
    }));
}

function restoreAnswers() {
    try {
        var raw = JSON.parse(localStorage.getItem(storageKey()) || '{}');
        var map = state.mode === 'fill' ? (raw.answersFill || {}) : (raw.answersSelect || {});
        for (var id in map) {
            var el = document.getElementById(id);
            if (el) el.value = map[id];
        }
    } catch (e) {}
}

function clearSavedAnswers() {
    try {
        var raw = JSON.parse(localStorage.getItem(storageKey()) || '{}');
        raw.answersSelect = {};
        raw.answersFill = {};
        raw.mode = state.mode;
        raw.setIds = state.setIds;
        localStorage.setItem(storageKey(), JSON.stringify(raw));
    } catch (e) {
        localStorage.removeItem(storageKey());
    }
}

function pickRandomSet() {
    var copy = activeQuestionPool().slice();
    for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = copy[i];
        copy[i] = copy[j];
        copy[j] = t;
    }
    state.setIds = copy.slice(0, getSetSize()).map(function (q) { return q.id; });
    state.activeSet = state.setIds.map(function (id, i) {
        var q = poolById[id];
        return { num: i + 1, poolId: id, time: q.time, correct: q.correct, options: q.options, grammar: q.grammar, hint: q.hint, appendix: q.appendix };
    });
}

function shuffleOptions(options, correct) {
    var arr = options.slice();
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
    }
    if (arr.indexOf(correct) < 0) arr.unshift(correct);
    return arr;
}

function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function buildAppendixHtml() {
    var seen = {};
    var html = '';
    QUESTION_POOL.forEach(function (item) {
        if (!item.appendix || seen[item.appendix.phrase]) return;
        seen[item.appendix.phrase] = true;
        html += '<li><strong>' + item.appendix.phrase + '</strong> — ' + item.appendix.slovak + '</li>';
    });
    return html;
}

function scrollQuestionIntoView(el) {
    var box = el.closest('.box');
    if (box) {
        box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
}

function isAnswerCorrect(el) {
    var fillMode = state.mode === 'fill';
    var userAnswer = el.value;
    var correctAnswer = el.getAttribute('data-correct');
    if (userAnswer === '' || userAnswer === null) return null;
    if (fillMode) {
        return answersMatchFill(userAnswer, correctAnswer);
    }
    return userAnswer === correctAnswer;
}

function clearQuestionFeedback(el) {
    var resultDiv = document.getElementById('result' + el.id.replace('ans', ''));
    el.classList.remove('correct-answer', 'wrong-answer');
    if (resultDiv) {
        resultDiv.classList.remove('result-correct', 'result-wrong');
        resultDiv.textContent = '';
    }
}

function evaluateQuestionEl(el, options) {
    var live = options && options.live;
    var onBlur = options && options.onBlur;
    var resultDiv = document.getElementById('result' + el.id.replace('ans', ''));
    if (!resultDiv) return;

    var correctAnswer = el.getAttribute('data-correct');
    var fillMode = el.getAttribute('data-answer-kind') === 'fill';

    if (live && fillMode) {
        var okFill = isAnswerCorrect(el);
        if (!onBlur) {
            clearQuestionFeedback(el);
            if (okFill === true) {
                el.classList.add('correct-answer');
                resultDiv.textContent = 'Correct!';
                resultDiv.classList.add('result-correct');
            }
            return;
        }
        clearQuestionFeedback(el);
        if (okFill === null) return;
        if (okFill === true) {
            el.classList.add('correct-answer');
            resultDiv.textContent = 'Correct!';
            resultDiv.classList.add('result-correct');
            return;
        }
        el.classList.add('wrong-answer');
        resultDiv.textContent = 'Wrong — try again.';
        resultDiv.classList.add('result-wrong');
        return;
    }

    var ok = isAnswerCorrect(el);
    clearQuestionFeedback(el);
    if (ok === null) return;

    if (ok) {
        el.classList.add('correct-answer');
        resultDiv.textContent = 'Correct!';
        resultDiv.classList.add('result-correct');
    } else {
        el.classList.add('wrong-answer');
        if (live) {
            resultDiv.textContent = 'Wrong — try again.';
        } else {
            resultDiv.textContent = 'Wrong! Correct: It\'s ' + correctAnswer + '.';
        }
        resultDiv.classList.add('result-wrong');
    }
}

function updateScoreSummary() {
    if (!state.liveCheckEnabled) return;
    var summary = document.getElementById('scoreSummary');
    if (!summary) return;
    var correctCount = document.querySelectorAll('[data-answer-kind].correct-answer').length;
    summary.textContent = 'Score: ' + correctCount + ' / ' + state.activeSet.length + ' correct';
}

function attachAnswerFieldListeners() {
    document.querySelectorAll('[data-answer-kind]').forEach(function (el) {
        el.addEventListener('focus', function () {
            scrollQuestionIntoView(el);
        });
        el.addEventListener('change', function () {
            saveState();
            if (state.liveCheckEnabled) {
                evaluateQuestionEl(el, { live: true });
                updateScoreSummary();
            }
        });
        if (el.getAttribute('data-answer-kind') === 'fill') {
            el.addEventListener('input', function () {
                saveState();
                if (!state.liveCheckEnabled) return;
                clearTimeout(fillDebounceTimers[el.id]);
                fillDebounceTimers[el.id] = setTimeout(function () {
                    evaluateQuestionEl(el, { live: true, onBlur: false });
                    updateScoreSummary();
                }, 350);
            });
            el.addEventListener('blur', function () {
                if (!state.liveCheckEnabled) return;
                evaluateQuestionEl(el, { live: true, onBlur: true });
                updateScoreSummary();
            });
        }
    });
}

function renderWorksheet() {
    state.liveCheckEnabled = false;
    fillDebounceTimers = {};
    var root = document.getElementById('timeWorksheet');
    var questionsHtml = '';
    var fillMode = state.mode === 'fill';

    state.activeSet.forEach(function (item) {
        var inputHtml;
        if (fillMode) {
            inputHtml = '<input type="text" id="ans' + item.num + '" data-answer-kind="fill" data-correct="' + escapeAttr(item.correct) + '" placeholder="type the time phrase" autocomplete="off" spellcheck="false">';
        } else {
            var opts = shuffleOptions(item.options, item.correct);
            var optHtml = opts.map(function (opt) {
                return '<option value="' + escapeAttr(opt) + '">' + opt + '</option>';
            }).join('');
            inputHtml = '<select id="ans' + item.num + '" data-answer-kind="select" data-correct="' + escapeAttr(item.correct) + '">'
                + '<option value="">Choose the correct answer…</option>' + optHtml + '</select>';
        }

        questionsHtml += ''
            + '<div class="box" data-pool-id="' + item.poolId + '">'
            + '<p><strong>' + item.num + '. What time is it?</strong> <span class="time-badge">' + item.time + '</span></p>'
            + '<p class="answer-line"><span>It\'s</span> ' + inputHtml + '<span>.</span></p>'
            + '<button type="button" class="hint-toggle" onclick="toggleHint(' + item.num + ')">Show / Hide Hint</button>'
            + '<div id="hint' + item.num + '" class="hint-content">'
            + '<p><strong>Pattern:</strong> ' + item.grammar + '</p>'
            + '<p><strong>Tip:</strong> ' + item.hint + '</p>'
            + '<p><strong>Correct answer:</strong> It\'s ' + item.correct + '.</p>'
            + '</div>'
            + '<div id="result' + item.num + '" class="result-text"></div>'
            + '</div>';
    });

    var modeIntro = fillMode
        ? 'Type the full phrase after <strong>It\'s</strong> (e.g. <em>quarter past six</em>). You don\'t need to type "It\'s" again.'
        : 'Choose the correct phrase after <strong>It\'s</strong>. Use <em>o\'clock</em>, <em>past</em>, <em>to</em>, <em>half past</em>, and <em>quarter past / quarter to</em>.';

    var modeBarHtml = profile.lockMode
        ? ''
        : '<div class="mode-bar">'
            + '<button type="button" class="mode-btn' + (fillMode ? '' : ' active') + '" onclick="setMode(\'select\')">Choose answer</button>'
            + '<button type="button" class="mode-btn' + (fillMode ? ' active' : '') + '" onclick="setMode(\'fill\')">Type answer</button>'
            + '</div>';

    root.innerHTML = ''
        + '<h2>Worksheet 6 – Telling the Time: What time is it? <span class="profile-badge">' + profileLabel() + '</span></h2>'
        + '<p class="intro">' + modeIntro + '</p>'
        + modeBarHtml
        + '<p class="set-meta">' + getSetSize() + ' questions in this set · pool of ' + activeQuestionPool().length + ' · <strong>New set</strong> picks different times</p>'
        + questionsHtml
        + '<div class="controls">'
        + '<button type="button" onclick="checkAnswers()">Check Answers</button>'
        + '<button type="button" class="newset-button" onclick="newSet()">New set</button>'
        + '<button type="button" onclick="resetTest()">Zopakovať test</button>'
        + '<button type="button" class="copy-button" onclick="copyToClipboard()">Copy to Google Docs</button>'
        + '<button type="button" class="appendix-button" onclick="toggleAppendix()">Show / Hide Appendix</button>'
        + '</div>'
        + '<div id="scoreSummary"></div>'
        + '<div id="appendixPanel">'
        + '<h3>Appendix: Telling the time in English</h3>'
        + '<ul id="appendixList">' + buildAppendixHtml() + '</ul>'
        + '</div>';

    attachAnswerFieldListeners();
    restoreAnswers();
    saveState();
}

function setMode(mode) {
    if (profile.lockMode) return;
    if (state.mode === mode) return;
    saveState();
    state.mode = mode === 'fill' ? 'fill' : 'select';
    renderWorksheet();
}

function newSet() {
    if (!confirm('New set: ' + getSetSize() + ' new random questions. Your current answers will be cleared.')) return;
    pickRandomSet();
    clearSavedAnswers();
    renderWorksheet();
}

function normalizeFillAnswer(text) {
    return String(text || '')
        .toLowerCase()
        .trim()
        .replace(/^it['']s\s+/, '')
        .replace(/\s+/g, ' ')
        .replace(/['']/g, "'");
}

function answersMatchFill(user, correct) {
    return normalizeFillAnswer(user) === normalizeFillAnswer(correct);
}

function toggleHint(num) {
    var hint = document.getElementById('hint' + num);
    var isHidden = getComputedStyle(hint).display === 'none';
    hint.style.display = isHidden ? 'block' : 'none';
}

function checkAnswers() {
    state.liveCheckEnabled = true;
    state.activeSet.forEach(function (item) {
        var el = document.getElementById('ans' + item.num);
        if (el) evaluateQuestionEl(el, { live: false });
    });
    updateScoreSummary();
    saveState();
}

function resetTest() {
    if (!confirm('Zopakovať test? Odpovede sa vymažú, otázky v sade ostanú rovnaké.')) return;
    state.liveCheckEnabled = false;
    document.querySelectorAll('.result-text').forEach(function (el) { el.textContent = ''; });
    document.querySelectorAll('[data-answer-kind]').forEach(function (el) {
        el.value = '';
        el.classList.remove('correct-answer', 'wrong-answer');
    });
    var summary = document.getElementById('scoreSummary');
    if (summary) summary.textContent = '';
    clearSavedAnswers();
}

function copyToClipboard() {
    var textToCopy = 'Telling the Time – What time is it? (' + (state.mode === 'fill' ? 'fill in' : 'multiple choice') + ')\n\n';
    state.activeSet.forEach(function (item) {
        textToCopy += item.num + '. What time is it? ' + item.time + '\n';
        textToCopy += '   It\'s ................................ ' + item.correct + '.\n\n';
    });
    navigator.clipboard.writeText(textToCopy).then(function () {
        alert('Otázky skopírované do schránky pre Google Docs!');
    }).catch(function () {
        alert('Nepodarilo sa skopírovať. Skúste to prosím manuálne.');
    });
}

function toggleAppendix() {
    var appendixPanel = document.getElementById('appendixPanel');
    var isHidden = getComputedStyle(appendixPanel).display === 'none';
    appendixPanel.style.display = isHidden ? 'block' : 'none';
}

function boot() {
    applyProfileFromUrl();
    buildLevelSwitch();
    if (!loadState()) {
        pickRandomSet();
    }
    renderWorksheet();
}

window.onload = boot;
window.setMode = setMode;
window.newSet = newSet;
window.checkAnswers = checkAnswers;
window.resetTest = resetTest;
window.copyToClipboard = copyToClipboard;
window.toggleAppendix = toggleAppendix;
window.toggleHint = toggleHint;
</script>

</body>
</html>
